name: Verify static site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows 运行器的默认控制台编码是 cp1252，脚本里打印中文会直接 UnicodeEncodeError
    # （build_gallery.py 的「跳过 xxx.md」就踩了这个），统一强制 UTF-8。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Run verification (Linux)
        if: runner.os == 'Linux'
        run: ./verify.sh --target site

      - name: Run verification (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verify.ps1 -Target site

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-site-verification-${{ matrix.os }}
          path: reports/site
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Scan for exposed credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
