name: Build single-file binaries

# 打 tag（v*）时构建三系统的单文件可执行程序，并作为 Release 附件上传。
# 也可以手动触发（workflow_dispatch）只构建、不上传，产物留在 Actions 的 artifact 里。
#
# 为什么不把 exe 提交进仓库：单文件版内嵌了整份 Node 运行时，约 100 MB，
# 进 git 会把仓库撑爆。Release 附件才是它的正规去处（dist/ 已在 .gitignore 里）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 上传 Release 附件需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build single-file executable
        run: node scripts/tools/build-exe.mjs

      - name: Smoke test (the binary must at least start and answer with its own error message)
        shell: bash
        run: |
          set +e
          output=$("./dist/ujn-grade-export-${{ runner.os == 'Windows' && 'win32' || runner.os == 'macOS' && 'darwin' || 'linux' }}-$(node -p 'process.arch')${{ runner.os == 'Windows' && '.exe' || '' }}" --user smoketest --password smoketest --term 9 2>&1)
          status=$?
          echo "$output"
          # --term 9 是非法值：程序应当用「学期只能是 1 / 2 / 3」这类人话报错并非 0 退出。
          # 这能证明二进制真的能跑起来（而不是注入失败的废文件）。
          if [ $status -eq 0 ]; then
            echo "::error::二进制没有按预期拒绝非法参数"
            exit 1
          fi
          case "$output" in
            *"学期只能是"*) echo "冒烟测试通过" ;;
            *) echo "::error::二进制没有给出预期的人话错误"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ujn-grade-export-${{ matrix.os }}
          path: dist/ujn-grade-export-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ujn-grade-export-*
          generate_release_notes: true
          body: |
            济大教务 · 成绩导出 —— 单文件版（内置 Node 运行时，双击即用，约 100 MB）

            | 系统 | 下载 |
            | --- | --- |
            | Windows | `ujn-grade-export-win32-x64.exe` |
            | macOS（Apple 芯片） | `ujn-grade-export-darwin-arm64` |
            | macOS（Intel） | `ujn-grade-export-darwin-x64` |
            | Linux | `ujn-grade-export-linux-x64` |

            macOS / Linux 首次运行前需要加执行权限：`chmod +x 文件名`。
            首次运行会依次询问学号、密码（输入时不显示）、学期，成绩单默认存到「下载」目录。
            账号密码只在本机内存里用一次，不写入磁盘、不发给任何第三方。
