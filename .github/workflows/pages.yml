name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署需要这三项权限：读取仓库、写 Pages、用 OIDC 换取部署令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    env:
      GRADE_EXPORT_API_URL: ${{ vars.GRADE_EXPORT_API_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Resolve Pages URL
        # 项目站点部署在 https://<owner>.github.io/<repo>/ 子路径下，
        # 用 SITE_URL 覆盖 mkdocs.yml 的 site_url（Pagefind 的结果链接也会跟着带上子路径）
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            echo "SITE_URL=https://$owner.github.io/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$owner.github.io/$repo/" >> "$GITHUB_ENV"
          fi

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
