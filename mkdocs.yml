site_name: 济南大学校园通
site_description: 济南大学新生/在校生一站式生活与学习指南
site_author: 济南大学学子

# 生产站点地址。GitHub Pages 项目站点部署在子路径下，用环境变量覆盖即可：
#   SITE_URL=https://<owner>.github.io/<repo>/ npm run build
site_url: !ENV [SITE_URL, "https://ujn.matehub.top/"]

theme:
  name: material
  custom_dir: overrides
  language: zh
  # 关闭 Material 默认的 Google Fonts（Roboto / Roboto Mono）：那是一个阻塞渲染的
  # 外部样式表，国内网络下经常挂起，还会把访客 IP 交给 Google。关掉后走系统字体栈，
  # 中文交给 PingFang SC / 微软雅黑 / Noto Sans CJK 渲染。
  font: false
  logo: assets/ujn-logo.webp
  favicon: assets/ujn-logo.webp
  palette: 
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes         # index.md 作为分组首页
    - navigation.instant         # 即时导航，消除页面切换闪烁
    - navigation.instant.progress
    - navigation.tracking        # 跟踪当前活动项
    - navigation.collapsible     # 侧边栏目录可折叠，默认折叠
    # 注意：不要开 toc.integrate。它在所有宽度下都会把本页目录并进左侧导航，
    # 桌面端右侧的「目录」栏会整个消失（第 2 轮误开过一次，第 9 轮发现并回退）。
    - content.code.copy
    - content.tabs.link

# Markdown 语法扩展
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - abbr
  - md_in_html              # 支持 HTML 中嵌套 Markdown（grid cards 需要）
  - pymdownx.tabbed:           # 新增：支持内容选项卡切换
      alternate_style: true
  - pymdownx.emoji:            # 新增：支持表情和图标
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 构建钩子 — auto Pagefind
hooks:
  - hooks/pagefind.py

# 这些页面由摘要页、详情卡片或正文链接进入，不放入一级导航，避免主导航被原文附录淹没。
not_in_nav: |
  /clubs/appendix/
  /clubs/societies/ftf-board-game.md
  /green-book/academic/appendix/
  /green-book/appeal/济南大学学生申诉办法/
  /green-book/scholarship/appendix/
  /green-book/youth-league/appendix/
  /pets/cats/
  /rules/appendix/
  /site-guide/main-campus/图书馆须知与问答/
  /site-guide/shungeng-campus/library-*.md
  /site-guide/shungeng-campus/图书馆须知与问答/

# 插件配置
plugins:
  # search 插件仅用于渲染搜索 UI 框架，实际搜索由 Pagefind 驱动
  - search:
      enabled: true
  - mermaid2
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      # 猫猫卡牌墙的照片由 docs/pets/gallery.js 自己处理（点击打开相册弹窗）。
      # 带 pet-photo 类的图片必须跳过，否则插件会把 <img> 抽出来单独包一层 <a>，
      # 破坏卡牌的 DOM 结构。
      skip_classes:
        - pet-photo
  - tags
  # - git-revision-date-localized:
  #     type: timeago

# 顶部全局公告栏
extra:
  announce: "🚧 近期项目维护较为频繁，部署期间服务会暂停 2~3 分钟，请见谅 🙏"
  # 顶部 QQ 群按钮链接：后续只需把空值替换为实际 HTTPS 群链接即可
  qq_group_url: "https://qm.qq.com/q/USLqZInHwI"
  # 仓库链接已暂时隐藏，防止恶意爬取
  # social:
  #   - icon: fontawesome/brands/github
  #     link: https://github.com/K-zhaochao/ujn-guide
  #   - icon: fontawesome/brands/git-alt
  #     link: https://gitee.com/Draven323/ujn-guide
  #     name: Gitee
  flea_market:
    name: 跳蚤市场
    link: #flea-market

extra_css:
  - assets/zongce-calculator/calculator.css?v=20260907-1
  # 站点自定义样式（原先内联在 overrides/main.html 的 <style> 里）。
  # 改动这个文件后要递增 ?v=，否则访客会继续用缓存里的旧样式。
  - assets/stylesheets/ujn.css?v=20261007-6

extra_javascript:
  - javascripts/mathjax.js?v=20260907-1
  - javascripts/github-issues.js?v=20260909-1
  # 窄屏的「本页目录」：桌面端目录栏在 1220px 以下会被 Material 隐藏，这个脚本补上
  - javascripts/mobile-toc.js?v=20260911-1
  # 搜索面板的「大家都在搜」（标记在 overrides/partials/search.html）
  - javascripts/hot-search.js?v=20261007-2
  - assets/zongce-calculator/calculator-core.js?v=20260907-1
  - assets/zongce-calculator/calculator.js?v=20260907-1
  - pets/gallery.js?v=20260910-3

