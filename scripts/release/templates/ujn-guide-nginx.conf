# Render this template with the actual domain, certificate and paths before use.
# The release root holds immutable directories and current is the only switched link.
server {
    listen 443 ssl http2;
    server_name $server_name;

    # ssl_certificate and ssl_certificate_key are managed by the host, not a release.
    root $release_root/current/site;
    index index.html;
    client_max_body_size 15m;

    # Keep dynamic routes ahead of the static-file regex locations commonly
    # supplied by hosting panels. proxy_pass deliberately has no trailing / so
    # Express receives the original /api/... request path.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
