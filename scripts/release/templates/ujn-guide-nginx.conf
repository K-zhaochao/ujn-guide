# Render this template with the actual domain, certificate and paths before use.
# The release root holds immutable directories and current is the only switched link.
server {
    listen 443 ssl http2;
    server_name $server_name;

    # ujn_safe is defined by ujn-guide-log-format.conf in http {}, not here.
    # Adapt this destination to the actual 1Panel/OpenResty log mount.
    access_log /var/log/nginx/ujn-guide-access.log ujn_safe;

    # ssl_certificate and ssl_certificate_key are managed by the host, not a release.
    root $release_root/current/site;
    index index.html;
    # Must be at least the value derived from MAX_IMAGES_PER_SUBMISSION and
    # MAX_IMAGE_SIZE_MB. Default 10 x 2 MiB needs 28m; 20 x 2 MiB needs 55m.
    # Runtime settings may narrow this policy, never raise its environment cap.
    client_max_body_size 28m;

    # Keep dynamic routes ahead of the static-file regex locations commonly
    # supplied by hosting panels. proxy_pass deliberately has no trailing / so
    # Express receives the original /api/... request path.
    location ^~ /api/ {
        # Native error_log cannot redact request URLs. Keep sanitized access
        # and backend error logs; do not persist raw API diagnostics here.
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    # Binary encrypted backups are not Base64 image JSON. Match the runtime
    # BACKUP_EXPORT_MAX_MB (default 128); do not raise all API limits for backups.
    location ^~ /api/admin/restore-imports/ {
        error_log /dev/null crit;
        client_max_body_size 128m;
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
