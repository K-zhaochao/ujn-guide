# Include inside OpenResty/Nginx http {}, BEFORE the site's server {} include.
# Never include $request, $request_uri, $args, cookies, Authorization or Referer.
# $uri deliberately omits the query containing OAuth codes and download tokens.
log_format ujn_safe escape=json
    '{"time":"$time_iso8601","requestId":"$request_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstreamStatus":"$upstream_status","upstreamDuration":"$upstream_response_time"}';
